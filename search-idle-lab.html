<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="robots" content="noindex, nofollow" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ожидание строки поиска</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07090d;
      --panel: #12161e;
      --ink: #e8eef7;
      --mute: #7d8a9a;
      --accent: #3dffe0;
      --line: rgba(232, 238, 247, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Rajdhani", sans-serif;
      background:
        radial-gradient(ellipse 70% 45% at 20% 0%, #0f1a1c, transparent 55%),
        var(--bg);
      color: var(--ink);
      padding: 1.35rem clamp(1rem, 3vw, 2rem) 3rem;
    }
    h1 {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0 0 0.35rem;
    }
    .lead {
      color: var(--mute);
      margin: 0 0 1.1rem;
      max-width: 44rem;
      line-height: 1.45;
    }
    .lead strong { color: var(--accent); }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    .card {
      background: color-mix(in srgb, var(--panel) 94%, black);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card.is-picked {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .card-num {
      font-family: "Orbitron", sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      color: var(--accent);
    }
    .card-title { font-weight: 700; font-size: 1.05rem; }
    .card-desc { margin: 0; color: var(--mute); font-size: 0.86rem; line-height: 1.35; }
    .demo {
      padding: 1.25rem 0.9rem 1.4rem;
      border-radius: 12px;
      background: #0a0c10;
      border: 1px solid var(--line);
    }
    .wrap {
      position: relative;
      max-width: 100%;
    }
    .wrap input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      text-align: center;
      padding: 0.85rem 1rem;
      outline: none;
      -webkit-appearance: none;
    }
    .wrap input::placeholder { color: var(--mute); text-align: center; }
    .scan {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 0;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
      pointer-events: none;
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .wrap:focus-within .scan,
    .wrap.is-typing .scan {
      opacity: 1;
      left: 4%;
      right: 4%;
    }
    /* typing overrides idle */
    .wrap.is-typing .scan,
    .wrap:focus-within.is-typing .scan {
      animation: none;
    }
    .wrap.is-typing {
      /* typing uses site pulse+sweep feel lightly */
    }
    .wrap.is-typing .scan {
      background: linear-gradient(90deg, transparent 0%, var(--accent) 45%, #b8fff5 50%, var(--accent) 55%, transparent 100%);
      background-size: 200% 100%;
      animation: type-pulse 1.1s ease-in-out infinite, type-sweep 2.4s linear infinite !important;
    }
    @keyframes type-pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes type-sweep {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .pick {
      margin-top: auto;
      align-self: flex-start;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      color: var(--accent);
      font: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .card.is-picked .pick {
      background: var(--accent);
      color: #041014;
      border-color: var(--accent);
    }
    .footer-pick {
      position: sticky;
      bottom: 0.75rem;
      margin-top: 1.4rem;
      padding: 0.9rem 1rem;
      border-radius: 14px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      background: color-mix(in srgb, var(--panel) 92%, black);
      backdrop-filter: blur(10px);
      color: var(--mute);
      font-size: 0.95rem;
      z-index: 5;
    }
    .footer-pick strong { color: var(--accent); }

    /* —— idle only when NOT typing —— */
    .v1:not(.is-typing) .scan {
      animation: idle-breathe 2.4s ease-in-out infinite;
    }
    @keyframes idle-breathe {
      0%, 100% { opacity: 0.28; left: 14%; right: 14%; }
      50% { opacity: 0.7; left: 8%; right: 8%; }
    }

    .v2:not(.is-typing) .scan {
      animation: idle-wander 3.2s ease-in-out infinite;
      width: 28%;
      left: 10%;
      right: auto;
    }
    @keyframes idle-wander {
      0%, 100% { left: 10%; opacity: 0.45; }
      50% { left: 62%; opacity: 0.85; }
    }

    .v3:not(.is-typing) .scan {
      animation: idle-dots 1.6s steps(4, end) infinite;
      background: none;
      height: auto;
      bottom: 0.15rem;
      text-align: center;
      left: 0; right: 0;
      box-shadow: none;
      opacity: 1;
    }
    .v3:not(.is-typing) .scan::after {
      content: "● ● ●";
      color: var(--accent);
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      opacity: 0.55;
      animation: idle-dots-fade 1.6s ease-in-out infinite;
    }
    @keyframes idle-dots-fade {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.9; }
    }
    @keyframes idle-dots { to { } }

    .v4:not(.is-typing) .scan {
      animation: idle-ping 2.2s ease-out infinite;
    }
    @keyframes idle-ping {
      0% { opacity: 0.85; left: 22%; right: 22%; box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 30%, transparent); }
      70% { opacity: 0; left: 4%; right: 4%; box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 20%, transparent); }
      100% { opacity: 0; }
    }

    .v5:not(.is-typing) .scan {
      animation: idle-shimmer 2.8s linear infinite;
      background: linear-gradient(90deg, transparent 0%, var(--accent) 40%, #fff 50%, var(--accent) 60%, transparent 100%);
      background-size: 220% 100%;
      opacity: 0.55;
    }
    @keyframes idle-shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .v6:not(.is-typing) input::placeholder {
      animation: idle-placeholder 2.6s ease-in-out infinite;
    }
    @keyframes idle-placeholder {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    .v6:not(.is-typing) .scan {
      animation: idle-breathe 2.6s ease-in-out infinite;
    }

    .v7:not(.is-typing) .scan {
      height: 2px;
      animation: idle-cursor 1.1s steps(2, end) infinite;
      left: 48%;
      right: 48%;
      min-width: 10px;
      background: var(--accent);
      border-radius: 1px;
    }
    @keyframes idle-cursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }

    .v8:not(.is-typing) .scan {
      animation: idle-radar 2.8s ease-in-out infinite;
    }
    @keyframes idle-radar {
      0%, 100% { left: 20%; right: 20%; opacity: 0.3; }
      50% { left: 6%; right: 6%; opacity: 0.85; }
    }

    .v9:not(.is-typing) .wrap-glow {
      animation: idle-halo 2.8s ease-in-out infinite;
    }
    .wrap-glow {
      position: absolute;
      inset: auto 12% -6px;
      height: 10px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 25%, transparent);
      filter: blur(6px);
      opacity: 0;
      pointer-events: none;
    }
    @keyframes idle-halo {
      0%, 100% { opacity: 0.15; transform: scaleX(0.7); }
      50% { opacity: 0.55; transform: scaleX(1); }
    }
    .v9:not(.is-typing) .scan {
      animation: idle-breathe 2.8s ease-in-out infinite;
    }

    .v10:not(.is-typing) .scan {
      animation: idle-soft-blink 3s ease-in-out infinite;
    }
    @keyframes idle-soft-blink {
      0%, 40%, 100% { opacity: 0.35; }
      50% { opacity: 0.9; }
      60% { opacity: 0.4; }
      70% { opacity: 0.75; }
    }

    .v11:not(.is-typing) .scan {
      animation: idle-eq 1.8s ease-in-out infinite;
    }
    @keyframes idle-eq {
      0%, 100% { clip-path: inset(0 18% 0 18%); opacity: 0.4; }
      50% { clip-path: inset(0 4% 0 4%); opacity: 0.85; }
    }

    .v12:not(.is-typing) .scan {
      animation: idle-dash 2.2s linear infinite;
      background: repeating-linear-gradient(90deg, var(--accent) 0 8px, transparent 8px 16px);
      background-size: 24px 100%;
      opacity: 0.55;
    }
    @keyframes idle-dash {
      to { background-position: 24px 0; }
    }
  </style>
</head>
<body>
  <h1>Анимация ожидания</h1>
  <p class="lead">
    Пока поле пустое — идёт <strong>ожидание</strong>. Начни печатать — idle гаснет,
    включается эффект ввода. Выбери номер.
  </p>

  <div class="grid" id="grid"></div>
  <div class="footer-pick" id="chosen">Выбрано: <strong>пока ничего</strong></div>

  <script>
    const VARIANTS = [
      { id: 1, title: "Breathe", desc: "Полоска тихо дышит — ширина и яркость." },
      { id: 2, title: "Wander", desc: "Короткий сегмент гуляет туда-сюда." },
      { id: 3, title: "Dots", desc: "Три точки ожидания под строкой." },
      { id: 4, title: "Ping", desc: "Волна расходится и гаснет." },
      { id: 5, title: "Shimmer", desc: "Медленный блик бежит по линии." },
      { id: 6, title: "Placeholder pulse", desc: "Мигает подсказка + лёгкое дыхание линии." },
      { id: 7, title: "Cursor blink", desc: "Как мигающий курсор по центру." },
      { id: 8, title: "Radar", desc: "Линия то короче, то длиннее." },
      { id: 9, title: "Soft halo", desc: "Мягкое свечение под строкой." },
      { id: 10, title: "Soft blink", desc: "Редкое двойное моргание." },
      { id: 11, title: "Equalizer", desc: "Ширина «дышит» как эквалайзер." },
      { id: 12, title: "Dash crawl", desc: "Пунктир медленно ползёт." },
    ];

    const grid = document.getElementById("grid");
    const chosen = document.getElementById("chosen");

    VARIANTS.forEach((v) => {
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.variant = String(v.id);
      card.innerHTML = `
        <span class="card-num">ВАРИАНТ ${v.id}</span>
        <div class="card-title">${v.title}</div>
        <p class="card-desc">${v.desc}</p>
        <div class="demo">
          <div class="wrap v${v.id}">
            ${v.id === 9 ? '<span class="wrap-glow" aria-hidden="true"></span>' : ""}
            <input type="search" placeholder="Название предмета…" autocomplete="off" spellcheck="false" />
            <span class="scan" aria-hidden="true"></span>
          </div>
        </div>
        <button type="button" class="pick">Выбрать</button>
      `;
      const wrap = card.querySelector(".wrap");
      const input = card.querySelector("input");
      let idleTimer = null;

      function syncTyping() {
        const typing = Boolean(input.value);
        wrap.classList.toggle("is-typing", typing);
        if (typing) {
          clearTimeout(idleTimer);
          idleTimer = setTimeout(() => {
            if (!input.value) wrap.classList.remove("is-typing");
          }, 800);
        }
      }
      input.addEventListener("input", () => {
        wrap.classList.add("is-typing");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          if (!input.value) wrap.classList.remove("is-typing");
          else wrap.classList.add("is-typing");
        }, 800);
        if (!input.value) wrap.classList.remove("is-typing");
      });

      card.querySelector(".pick").addEventListener("click", () => {
        document.querySelectorAll(".card").forEach((c) => c.classList.remove("is-picked"));
        card.classList.add("is-picked");
        chosen.innerHTML = `Выбрано: <strong>вариант ${v.id} — ${v.title}</strong>. Напиши в чат: <strong>${v.id}</strong>`;
      });
      grid.appendChild(card);
    });
  </script>
</body>
</html>
