    <button type="button" class="theme-switch" id="themeToggle" role="switch" aria-checked="true" aria-label="Сменить тему" title="Тёмная → серая → светлая">
      <span class="theme-switch-track" aria-hidden="true">
        <span class="theme-switch-icon theme-icon-moon">☾</span>
        <span class="theme-switch-icon theme-icon-gray">●</span>
        <span class="theme-switch-icon theme-icon-sun">☀</span>

  <main class="cat-shell">
    <p class="seo-intro cat-seo-intro">
      Каталог

      <a href="./">К поиску</a>

      <a href="./sections/sale.html">скидки</a>

      <a href="./sections/wings.html">крылья</a>
      ·
      <a href="./sections/pets.html">питомцы</a>.

    <section class="cat-controls">
      <input
        id="catQ"
        class="cat-search"
        type="search"
        placeholder="Фильтр по названию…"
        autocomplete="off"
        spellcheck="false"
      />
      <div class="filters cat-filters">
        <button type="button" class="chip-toggle" id="saleToggle" aria-pressed="false">Скидки</button>
        <button type="button" class="chip-toggle favs-toggle" id="favsToggle" aria-pressed="false">
          <span class="favs-toggle-icon" aria-hidden="true">★</span>
          <span>Избранное</span>
          <span class="favs-toggle-count" id="favsCount">0</span>
        </button>
      </div>
      <div class="filter-pills cat-filter-pills" id="categoryPills" role="group" aria-label="Раздел">
        <button type="button" class="filter-pill on" data-category="" aria-pressed="true">Все</button>
        <button type="button" class="filter-pill" data-category="packs" aria-pressed="false">Наборы</button>
        <button type="button" class="filter-pill" data-category="wings" aria-pressed="false">Крылья</button>
        <button type="button" class="filter-pill" data-category="pets" aria-pressed="false">Питомцы</button>
        <button type="button" class="filter-pill" data-category="tricks" aria-pressed="false">Транспорт</button>
        <button type="button" class="filter-pill" data-category="items" aria-pressed="false">Предметы</button>
        <button type="button" class="filter-pill" data-category="clothes" aria-pressed="false">Внешность</button>
        <button type="button" class="filter-pill" data-category="child_goods" aria-pressed="false">Детям</button>
      </div>
      <div class="filter-pills cat-filter-pills" id="genderPills" role="group" aria-label="Пол">
        <button type="button" class="filter-pill on" data-gender="" aria-pressed="true">Все</button>
        <button type="button" class="filter-pill" data-gender="m" aria-pressed="false">М</button>
        <button type="button" class="filter-pill" data-gender="f" aria-pressed="false">Ж</button>
      </div>
      <div class="filter-pills cat-filter-pills" id="badgePills" role="group" aria-label="Метки">
        <button type="button" class="filter-pill on" data-badge="" aria-pressed="true">Все</button>
        <button type="button" class="filter-pill" data-badge="temp" aria-pressed="false">★ врем.</button>
        <button type="button" class="filter-pill" data-badge="event" aria-pressed="false">☆ ивент</button>

        <button type="button" class="sort-pill" data-sort="price-desc">цена ↓</button>
        <button type="button" class="sort-pill" data-sort="discount">скидка</button>
