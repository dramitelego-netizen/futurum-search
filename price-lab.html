<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Цены — варианты «было / стало»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07090d;
      --panel: #12161e;
      --ink: #e8eef7;
      --mute: #7d8a9a;
      --accent: #3dffe0;
      --accent-2: #ff4d6d;
      --line: rgba(232, 238, 247, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Rajdhani", sans-serif;
      background: radial-gradient(ellipse 80% 50% at 50% 0%, #101820, var(--bg));
      color: var(--ink);
      padding: 1.4rem clamp(1rem, 3vw, 2rem) 3rem;
    }
    h1 {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1rem, 2.6vw, 1.35rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0 0 0.35rem;
    }
    .lead { color: var(--mute); margin: 0 0 1.25rem; }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    .card {
      background: color-mix(in srgb, var(--panel) 94%, black);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem 1.05rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .card-num {
      font-family: "Orbitron", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: var(--accent);
    }
    .card-title { font-weight: 700; font-size: 1.05rem; }
    .card-desc { margin: 0; color: var(--mute); font-size: 0.92rem; line-height: 1.35; }
    .stage {
      min-height: 5.5rem;
      display: grid;
      align-content: center;
      gap: 0.55rem;
      padding: 0.85rem;
      border-radius: 12px;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--line);
    }
    .item-name { font-weight: 700; font-size: 1rem; }
    .tag { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
    .actions { display: flex; gap: 0.5rem; margin-top: auto; }
    button {
      font: inherit;
      font-weight: 700;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(61,255,224,0.08);
      color: var(--ink);
      padding: 0.4rem 0.9rem;
      cursor: pointer;
    }
    button.pick {
      background: color-mix(in srgb, var(--accent) 22%, transparent);
      border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      color: #041410;
    }
    .picked {
      margin-top: 1.25rem;
      padding: 0.9rem 1rem;
      border-radius: 12px;
      border: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
      color: var(--mute);
    }
    .picked strong {
      color: var(--accent);
      font-family: "Orbitron", sans-serif;
      letter-spacing: 0.06em;
    }

    /* —— варианты —— */

    /* 1. Одна строка: 150 → 130 −20 */
    .v1 {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.35rem 0.5rem;
      font-variant-numeric: tabular-nums;
    }
    .v1 .old { color: var(--mute); text-decoration: line-through; font-size: 1rem; }
    .v1 .arrow { color: var(--mute); opacity: 0.6; }
    .v1 .now { font-family: "Orbitron", sans-serif; font-size: 1.35rem; font-weight: 800; color: var(--accent); }
    .v1 .delta {
      margin-left: 0.15rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      color: var(--accent);
      font-weight: 800;
      font-size: 0.85rem;
    }

    /* 2. Крупно только новая, старая мелко сверху */
    .v2 { display: grid; gap: 0.15rem; }
    .v2 .old { font-size: 0.85rem; color: var(--mute); }
    .v2 .old b { text-decoration: line-through; font-weight: 700; }
    .v2 .now {
      font-family: "Orbitron", sans-serif;
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    .v2 .delta { color: var(--accent); font-weight: 700; font-size: 0.9rem; }

    /* 3. Две колонки равно */
    .v3 {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.5rem;
      align-items: center;
    }
    .v3 .col {
      text-align: center;
      padding: 0.5rem 0.4rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
    }
    .v3 .col span { display: block; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
    .v3 .col b { font-family: "Orbitron", sans-serif; font-size: 1.15rem; }
    .v3 .col.is-new {
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }
    .v3 .col.is-new b { color: var(--accent); }
    .v3 .mid { color: var(--mute); font-size: 1.2rem; }

    /* 4. Процент скидки как главный акцент */
    .v4 { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .v4 .pct {
      width: 3.4rem; height: 3.4rem;
      border-radius: 50%;
      display: grid; place-items: center;
      font-family: "Orbitron", sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      color: #041410;
      background: var(--accent);
      flex-shrink: 0;
    }
    .v4 .lines { display: grid; gap: 0.1rem; }
    .v4 .old { color: var(--mute); text-decoration: line-through; }
    .v4 .now { font-family: "Orbitron", sans-serif; font-size: 1.35rem; font-weight: 800; color: var(--ink); }

    /* 5. Тикер / чек */
    .v5 {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.45rem 0.7rem;
      border-radius: 10px;
      background: #0a1210;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      font-variant-numeric: tabular-nums;
      font-family: "Orbitron", sans-serif;
    }
    .v5 .old { color: #6a7888; font-size: 0.85rem; }
    .v5 .now { color: var(--accent); font-size: 1.15rem; font-weight: 800; }
    .v5 .sep { color: #3a4654; }
    .v5 .delta { color: var(--accent-2); font-size: 0.8rem; }

    /* 6. Слайдер-бар от старой к новой */
    .v6 { display: grid; gap: 0.4rem; }
    .v6 .nums {
      display: flex; justify-content: space-between; align-items: baseline;
      font-variant-numeric: tabular-nums;
    }
    .v6 .old { color: var(--mute); text-decoration: line-through; }
    .v6 .now { font-family: "Orbitron", sans-serif; font-size: 1.25rem; font-weight: 800; color: var(--accent); }
    .v6 .bar {
      height: 6px; border-radius: 999px;
      background: color-mix(in srgb, var(--mute) 25%, transparent);
      overflow: hidden;
    }
    .v6 .bar > i {
      display: block; height: 100%; width: 86.7%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mute), var(--accent));
    }
    .v6 .hint { font-size: 0.8rem; color: var(--mute); }

    /* 7. Только дельта огромная + мелкий контекст */
    .v7 { display: flex; align-items: center; gap: 0.85rem; }
    .v7 .big {
      font-family: "Orbitron", sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    .v7 .sub { display: grid; gap: 0.1rem; color: var(--mute); font-size: 0.9rem; }
    .v7 .sub b { color: var(--ink); font-weight: 700; }

    /* 8. Чипы «было» / «стало» в одну линию компактно */
    .v8 { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
    .v8 .chip {
      display: inline-flex; align-items: baseline; gap: 0.3rem;
      padding: 0.28rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      font-size: 0.9rem;
    }
    .v8 .chip em { font-style: normal; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
    .v8 .chip.is-new {
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }
    .v8 .chip.is-new b { color: var(--accent); font-family: "Orbitron", sans-serif; }
    .v8 .delta { color: var(--accent); font-weight: 800; }

    /* 9. Табличная строка как в чеке */
    .v9 {
      display: grid;
      grid-template-columns: 4.5rem 1fr;
      gap: 0.2rem 0.75rem;
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
    }
    .v9 .k { color: var(--mute); }
    .v9 .old { text-decoration: line-through; color: var(--mute); }
    .v9 .now { font-family: "Orbitron", sans-serif; font-weight: 800; color: var(--accent); font-size: 1.2rem; }
    .v9 .d { color: var(--accent); font-weight: 700; }

    /* 10. Карточка сравнения split */
    .v10 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .v10 .half { padding: 0.55rem 0.65rem; }
    .v10 .half span { display: block; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
    .v10 .half b { font-family: "Orbitron", sans-serif; font-size: 1.2rem; }
    .v10 .a { background: rgba(255,255,255,0.03); }
    .v10 .a b { color: var(--mute); text-decoration: line-through; font-size: 1rem; }
    .v10 .b { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .v10 .b b { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Варианты цены</h1>
  <p class="lead">Пример: было 150 → стало 130 (−20). Нажми «Этот» и напиши номер в чат.</p>
  <div class="grid" id="grid"></div>
  <div class="picked" id="picked">Выбор: пока нет</div>

  <script>
    const FROM = 150;
    const TO = 130;
    const DELTA = TO - FROM;
    const PCT = Math.round((1 - TO / FROM) * 100);

    const variants = [
      {
        id: 1,
        title: "Строка",
        desc: "Всё в одну линию: старая зачёркнута, новая крупнее, дельта рядом.",
        html: `
          <div class="tag">Цена снизилась</div>
          <div class="item-name">Связка из 10 молотков</div>
          <div class="v1">
            <span class="old">${FROM}</span>
            <span class="arrow">→</span>
            <span class="now">${TO}</span>
            <span class="delta">${DELTA}</span>
          </div>`,
      },
      {
        id: 2,
        title: "Акцент на новой",
        desc: "Главное — новая цена крупно. Старая мелко сверху, как подсказка.",
        html: `
          <div class="tag">Цена снизилась</div>
          <div class="item-name">Связка из 10 молотков</div>
          <div class="v2">
            <div class="old">было <b>${FROM}</b></div>
            <div class="now">${TO} <span style="font-size:0.7rem;color:var(--mute)">монет</span></div>
            <div class="delta">${DELTA} монет</div>
          </div>`,
      },
      {
        id: 3,
        title: "Две равные колонки",
        desc: "Было и стало рядом как два блока — очень наглядно, чуть больше места.",
        html: `
          <div class="tag">Цена снизилась</div>
          <div class="item-name">Связка из 10 молоков</div>
          <div class="v3">
            <div class="col"><span>было</span><b>${FROM}</b></div>
            <div class="mid">→</div>
            <div class="col is-new"><span>стало</span><b>${TO}</b></div>
          </div>`,
      },
      {
        id: 4,
        title: "Круг со скидкой %",
        desc: "Сразу видно «−13%». Цены рядом обычным текстом.",
        html: `
          <div class="tag">Цена снизилась</div>
          <div class="item-name">Связка из 10 молоков</div>
          <div class="v4">
            <div class="pct">−${PCT}%</div>
            <div class="lines">
              <div class="old">${FROM} монет</div>
              <div class="now">${TO} монет</div>
            </div>
          </div>`,
      },
      {
        id: 5,
        title: "Тикер",
        desc: "Как строка котировки: компактно, в тёмной плашке.",
        html: `
          <div class="tag">Цена снизилась</div>
          <div class="item-name">Связка из 10 молоков</div>
          <div class="v5">
            <span class="old">${FROM}</span>
            <span class="sep">→</span>
            <span class="now">${TO}</span>
            <span class="delta">${DELTA}</span>
          </div>`,
      },
      {
        id: 6,
        title: "Полоска прогресса",
        desc: "Цены по краям + полоска, насколько упала цена.",
        html: `
          <div class="tag">Цена снизилась</div>
          <div class="item-name">Связка из 10 молоков</div>
          <div class="v6">
            <div class="nums">
              <span class="old">${FROM}</span>
              <span class="now">${TO}</span>
            </div>
            <div class="bar"><i></i></div>
            <div class="hint">ниже на ${Math.abs(DELTA)} монет (−${PCT}%)</div>
          </div>`,
      },
      {
        id: 7,
        title: "Главное — дельта",
        desc: "Сначала бросается в глаза −20, потом контекст было/стало.",
        html: `
          <div class="tag">Цена снизилась</div>
          <div class="item-name">Связка из 10 молоков</div>
          <div class="v7">
            <div class="big">${DELTA}</div>
            <div class="sub">
              <span>изменение цены</span>
              <span><b>${FROM}</b> → <b>${TO}</b> монет</span>
            </div>
          </div>`,
      },
      {
        id: 8,
        title: "Мягкие чипы",
        desc: "Два спокойных чипа «было / стало» без тяжёлых карточек.",
        html: `
          <div class="tag">Цена снизилась</div>
          <div class="item-name">Связка из 10 молоков</div>
          <div class="v8">
            <span class="chip"><em>было</em> <b>${FROM}</b></span>
            <span class="chip is-new"><em>стало</em> <b>${TO}</b></span>
            <span class="delta">${DELTA}</span>
          </div>`,
      },
      {
        id: 9,
        title: "Как чек",
        desc: "Строки «было / стало / разница» — максимально ясно, чуть суше.",
        html: `
          <div class="tag">Цена снизилась</div>
          <div class="item-name">Связка из 10 молоков</div>
          <div class="v9">
            <span class="k">было</span><span class="old">${FROM} монет</span>
            <span class="k">стало</span><span class="now">${TO} монет</span>
            <span class="k">разница</span><span class="d">${DELTA} монет</span>
          </div>`,
      },
      {
        id: 10,
        title: "Split-карточка",
        desc: "Экран разделён пополам: слева было, справа стало.",
        html: `
          <div class="tag">Цена снизилась</div>
          <div class="item-name">Связка из 10 молоков</div>
          <div class="v10">
            <div class="half a"><span>было</span><b>${FROM}</b></div>
            <div class="half b"><span>стало</span><b>${TO}</b></div>
          </div>`,
      },
    ];

    const grid = document.getElementById("grid");
    const picked = document.getElementById("picked");

    grid.innerHTML = variants.map((v) => `
      <article class="card" data-id="${v.id}">
        <div>
          <div class="card-num">#${v.id}</div>
          <div class="card-title">${v.title}</div>
        </div>
        <p class="card-desc">${v.desc}</p>
        <div class="stage">${v.html}</div>
        <div class="actions">
          <button type="button" class="pick" data-pick="${v.id}">Этот</button>
        </div>
      </article>
    `).join("");

    grid.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-pick]");
      if (!btn) return;
      const id = Number(btn.dataset.pick);
      const v = variants.find((x) => x.id === id);
      localStorage.setItem("futurum_price_pick", String(id));
      picked.innerHTML = `Выбор: <strong>#${id} — ${v.title}</strong>. Напиши в чат: «цену ${id}»`;
    });

    const saved = Number(localStorage.getItem("futurum_price_pick") || 0);
    if (saved) {
      const v = variants.find((x) => x.id === saved);
      if (v) picked.innerHTML = `Выбор: <strong>#${saved} — ${v.title}</strong>. Напиши в чат: «цену ${saved}»`;
    }
  </script>
</body>
</html>
