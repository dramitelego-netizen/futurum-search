<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="robots" content="noindex, nofollow" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favicon lab — FUTURUM</title>
  <link rel="icon" id="liveFav" href="" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07090d;
      --panel: #12161e;
      --ink: #e8eef7;
      --mute: #7d8a9a;
      --accent: #3dffe0;
      --line: rgba(232, 238, 247, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Rajdhani", sans-serif;
      background:
        radial-gradient(ellipse 70% 45% at 20% 0%, #0f1a1c, transparent 55%),
        var(--bg);
      color: var(--ink);
      padding: 1.35rem clamp(1rem, 3vw, 2rem) 3rem;
    }
    h1 {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0 0 0.35rem;
    }
    .lead {
      color: var(--mute);
      margin: 0 0 1.2rem;
      max-width: 40rem;
      line-height: 1.45;
    }
    .lead strong { color: var(--accent); }
    .hint {
      margin: 0 0 1.2rem;
      padding: 0.55rem 0.85rem;
      border-radius: 12px;
      border: 1px dashed color-mix(in srgb, var(--accent) 35%, var(--line));
      color: var(--mute);
      font-size: 0.9rem;
    }
    .hint em { color: var(--ink); font-style: normal; }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .card {
      background: color-mix(in srgb, var(--panel) 94%, black);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card.is-picked {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .card-num {
      font-family: "Orbitron", sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      color: var(--accent);
    }
    .card-title { font-weight: 700; font-size: 1.05rem; }
    .card-desc { margin: 0; color: var(--mute); font-size: 0.86rem; line-height: 1.35; }
    .preview {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem;
      border-radius: 12px;
      background: #0a0c10;
      border: 1px solid var(--line);
    }
    .preview.light {
      background: #eef2f5;
      border-color: #c8d0d8;
    }
    .sz {
      display: grid;
      gap: 0.25rem;
      justify-items: center;
      color: var(--mute);
      font-size: 0.65rem;
      letter-spacing: 0.06em;
    }
    .preview.light .sz { color: #6a7684; }
    .sz img, .sz svg {
      width: var(--s);
      height: var(--s);
      display: block;
      border-radius: 4px;
    }
    .pick {
      margin-top: auto;
      align-self: flex-start;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      color: var(--accent);
      font: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .pick:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
    .card.is-picked .pick {
      background: var(--accent);
      color: #041014;
      border-color: var(--accent);
    }
    .footer-pick {
      position: sticky;
      bottom: 0.75rem;
      margin-top: 1.5rem;
      padding: 0.9rem 1rem;
      border-radius: 14px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      background: color-mix(in srgb, var(--panel) 92%, black);
      backdrop-filter: blur(10px);
      color: var(--mute);
      font-size: 0.95rem;
      z-index: 5;
    }
    .footer-pick strong { color: var(--accent); }
    .tab-mock {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-top: 0.35rem;
      padding: 0.4rem 0.65rem;
      border-radius: 10px 10px 0 0;
      background: #1a1f28;
      border: 1px solid var(--line);
      border-bottom: none;
      width: fit-content;
      max-width: 100%;
      font-size: 0.78rem;
      color: #b8c2ce;
    }
    .tab-mock img, .tab-mock svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>Значок вкладки</h1>
  <p class="lead">
    Посмотри варианты в размере вкладки (16px) и крупнее.
    Нажми <strong>«Выбрать»</strong> — значок сразу появится на этой вкладке браузера, и напиши мне номер.
  </p>
  <p class="hint">Сейчас во вкладке: <em id="liveLabel">ничего</em> — кликни «Выбрать», чтобы примерить.</p>

  <div class="grid" id="grid"></div>
  <div class="footer-pick" id="chosen">Выбрано: <strong>пока ничего</strong></div>

  <script>
    const VARIANTS = [
      {
        id: 1,
        title: "F + точка",
        desc: "Буква F и сигнал в углу. Чистый бренд.",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#07090d"/><rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="none" stroke="#3dffe0" stroke-opacity=".35" stroke-width="1"/><path d="M9 8h14v3.2H12.6v3.4H21v3.1H12.6V24H9V8z" fill="#3dffe0"/><circle cx="24.2" cy="24.2" r="2.2" fill="#3dffe0"/></svg>`
      },
      {
        id: 2,
        title: "Только F",
        desc: "Крупная F на тёмном квадрате — максимально читается в 16px.",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#07090d"/><path d="M8 7h16v3.6H12.4v3.6H22v3.4H12.4V25H8V7z" fill="#3dffe0"/></svg>`
      },
      {
        id: 3,
        title: "Лупа / поиск",
        desc: "Иконка поиска — сразу понятно, что это поиск.",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#07090d"/><circle cx="14" cy="14" r="6.5" fill="none" stroke="#3dffe0" stroke-width="2.4"/><path d="M18.8 18.8L25 25" stroke="#3dffe0" stroke-width="2.6" stroke-linecap="round"/></svg>`
      },
      {
        id: 4,
        title: "F в круге",
        desc: "Круглый бейдж — мягче, как app-иконка.",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#07090d"/><circle cx="16" cy="16" r="14" fill="none" stroke="#3dffe0" stroke-opacity=".4" stroke-width="1.2"/><path d="M11 9.5h11v2.8h-7.2v2.8H20v2.6h-5.2V22.5H11V9.5z" fill="#3dffe0"/></svg>`
      },
      {
        id: 5,
        title: "Неон-рамка",
        desc: "Тонкая F внутри яркой рамки — «HUD».",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#05070a"/><rect x="3" y="3" width="26" height="26" rx="4" fill="none" stroke="#3dffe0" stroke-width="2"/><path d="M10 10h12v2.6H13.2v2.8H20v2.5H13.2V22H10V10z" fill="#3dffe0"/></svg>`
      },
      {
        id: 6,
        title: "Сигнал / пульс",
        desc: "Три дуги сигнала — футуристично, без буквы.",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#07090d"/><circle cx="16" cy="20" r="2.2" fill="#3dffe0"/><path d="M11.5 16.2a6.2 6.2 0 0 1 9 0" fill="none" stroke="#3dffe0" stroke-width="2" stroke-linecap="round"/><path d="M8.5 12.8a10.5 10.5 0 0 1 15 0" fill="none" stroke="#3dffe0" stroke-width="2" stroke-linecap="round" opacity=".7"/><path d="M5.8 9.5a14.5 14.5 0 0 1 20.4 0" fill="none" stroke="#3dffe0" stroke-width="2" stroke-linecap="round" opacity=".4"/></svg>`
      },
      {
        id: 7,
        title: "Ромб F",
        desc: "F внутри ромба — острее, игровой вайб.",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#07090d"/><path d="M16 3.5L28.5 16 16 28.5 3.5 16Z" fill="none" stroke="#3dffe0" stroke-width="1.6" opacity=".55"/><path d="M12 11h9v2.4h-5.6v2.2H19v2.3h-3.6V21H12V11z" fill="#3dffe0"/></svg>`
      },
      {
        id: 8,
        title: "Градиент F",
        desc: "F с бирюзово-мятным градиентом — чуть «дороже».",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="8" y1="6" x2="24" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#7dffe8"/><stop offset="1" stop-color="#2ad4b8"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="#07090d"/><path d="M8 7h16v3.6H12.4v3.6H22v3.4H12.4V25H8V7z" fill="url(#g)"/></svg>`
      },
      {
        id: 9,
        title: "Монохром светлый",
        desc: "Светлый фон + тёмная F — лучше на светлых темах ОС.",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#e8eef7"/><path d="M8 7h16v3.6H12.4v3.6H22v3.4H12.4V25H8V7z" fill="#0a1214"/></svg>`
      },
      {
        id: 10,
        title: "Акцент-заливка",
        desc: "Вся плитка бирюзовая, F тёмная — самый заметный во вкладках.",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#3dffe0"/><path d="M8 7h16v3.6H12.4v3.6H22v3.4H12.4V25H8V7z" fill="#041014"/></svg>`
      },
      {
        id: 11,
        title: "Точка + кольца",
        desc: "Как радар / цель — без текста, но узнаваемо «скан».",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#07090d"/><circle cx="16" cy="16" r="3" fill="#3dffe0"/><circle cx="16" cy="16" r="7" fill="none" stroke="#3dffe0" stroke-width="1.8" opacity=".75"/><circle cx="16" cy="16" r="11.5" fill="none" stroke="#3dffe0" stroke-width="1.5" opacity=".35"/></svg>`
      },
      {
        id: 12,
        title: "FS монограмма",
        desc: "F и S слиты — FUTURUM Search.",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#07090d"/><path d="M6.5 8h10.5v2.8H10v2.6h5.8v2.5H10V24H6.5V8z" fill="#3dffe0"/><path d="M18.2 12.2c0-2.2 1.7-3.7 4.2-3.7 1.7 0 3 .6 3.9 1.6l-1.9 1.9c-.5-.5-1.1-.8-2-.8-.9 0-1.5.5-1.5 1.2 0 .8.5 1.1 1.8 1.5l1.2.4c2.4.7 3.8 1.9 3.8 4.2 0 2.6-2 4.3-4.9 4.3-2.1 0-3.7-.8-4.8-2.1l2-1.9c.7.8 1.6 1.3 2.8 1.3 1.1 0 1.8-.5 1.8-1.3 0-.8-.5-1.2-1.9-1.6l-1.2-.4c-2.3-.7-3.5-2-3.5-4.1z" fill="#3dffe0" opacity=".9"/></svg>`
      },
      {
        id: 13,
        title: "Слот / витрина",
        desc: "Рамка как витрина каталога + точка товара.",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#07090d"/><rect x="7" y="7" width="18" height="18" rx="3" fill="none" stroke="#3dffe0" stroke-width="2"/><rect x="11" y="11" width="10" height="7" rx="1.5" fill="#3dffe0" opacity=".35"/><circle cx="16" cy="21.5" r="1.8" fill="#3dffe0"/></svg>`
      },
      {
        id: 14,
        title: "Шеврон вверх",
        desc: "Минимальный геометрический знак без буквы.",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#07090d"/><path d="M8 19L16 9l8 10" fill="none" stroke="#3dffe0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 22h10" stroke="#3dffe0" stroke-width="2.4" stroke-linecap="round" opacity=".55"/></svg>`
      },
      {
        id: 15,
        title: "Пиксель F",
        desc: "Блочная F — ретро-игровой стиль Parapa.",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#07090d"/><g fill="#3dffe0"><rect x="8" y="7" width="16" height="3.2"/><rect x="8" y="7" width="3.2" height="18"/><rect x="8" y="14.2" width="11" height="3.2"/></g></svg>`
      },
      {
        id: 16,
        title: "Двойной контур F",
        desc: "Контурная F — легче, воздушнее.",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#07090d"/><path d="M10 8h13v3H13.5v3H21v3h-7.5V24H10V8z" fill="none" stroke="#3dffe0" stroke-width="1.8" stroke-linejoin="round"/></svg>`
      }
    ];

    function svgUrl(svg) {
      return "data:image/svg+xml," + encodeURIComponent(svg);
    }

    function mark(svg, size) {
      return `<div class="sz" style="--s:${size}px"><img src="${svgUrl(svg)}" alt="" width="${size}" height="${size}" /><span>${size}</span></div>`;
    }

    const grid = document.getElementById("grid");
    const chosen = document.getElementById("chosen");
    const liveFav = document.getElementById("liveFav");
    const liveLabel = document.getElementById("liveLabel");

    VARIANTS.forEach((v) => {
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.variant = String(v.id);
      card.innerHTML = `
        <span class="card-num">ВАРИАНТ ${v.id}</span>
        <div class="card-title">${v.title}</div>
        <p class="card-desc">${v.desc}</p>
        <div class="preview">
          ${mark(v.svg, 16)}
          ${mark(v.svg, 24)}
          ${mark(v.svg, 48)}
        </div>
        <div class="preview light">
          ${mark(v.svg, 16)}
          ${mark(v.svg, 24)}
          ${mark(v.svg, 48)}
        </div>
        <div class="tab-mock">
          <img src="${svgUrl(v.svg)}" alt="" />
          <span>FUTURUM Search</span>
        </div>
        <button type="button" class="pick">Выбрать</button>
      `;
      card.querySelector(".pick").addEventListener("click", () => {
        document.querySelectorAll(".card").forEach((c) => c.classList.remove("is-picked"));
        card.classList.add("is-picked");
        liveFav.href = svgUrl(v.svg);
        liveLabel.textContent = `вариант ${v.id} — ${v.title}`;
        chosen.innerHTML = `Выбрано: <strong>вариант ${v.id} — ${v.title}</strong>. Напиши в чат: <strong>${v.id}</strong>`;
      });
      grid.appendChild(card);
    });
  </script>
</body>
</html>
