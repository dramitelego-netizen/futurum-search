# Slim GitLab Pages: site root → public/ (wiki_img already omitted from repo).
pages:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir -p public
    - |
      tar --exclude='./.git' \
          --exclude='./public' \
          --exclude='./data/wiki_img' \
          --exclude='./.gitlab-ci.yml' \
          -cf - . | tar -C public -xf -
    - du -sh public || true
  artifacts:
    paths:
      - public
