<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Промокод · FUTURUM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05070a;
      --ink: #e8eef7;
      --mute: #7d8a9a;
      --line: rgba(232, 238, 247, 0.1);
      --panel: rgba(14, 18, 26, 0.88);
      --panel-solid: rgba(10, 13, 18, 0.96);
      --accent: #3dffe0;
      --accent-ink: #041512;
      --accent-dim: rgba(61, 255, 224, 0.14);
      --shadow: rgba(0, 0, 0, 0.45);
      --font: "Rajdhani", "Segoe UI", sans-serif;
      --display: "Orbitron", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    html { background: var(--bg); }
    body {
      font-family: var(--font);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink);
      background: transparent;
      height: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: var(--bg);
      pointer-events: none;
    }
    .atm-wash {
      position: absolute;
      inset: -25%;
      background:
        linear-gradient(
          125deg,
          #040608 0%,
          #0a1520 26%,
          #0c1a1c 48%,
          #12101a 72%,
          #05070a 100%
        );
      background-size: 240% 240%;
      animation: atm-wash-drift 36s ease-in-out infinite alternate;
    }
    .atm-flow {
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(ellipse 58% 48% at 20% 28%, rgba(61, 255, 224, 0.14), transparent 68%),
        radial-gradient(ellipse 52% 44% at 80% 20%, rgba(80, 130, 190, 0.1), transparent 70%),
        radial-gradient(ellipse 62% 52% at 58% 85%, rgba(255, 77, 109, 0.08), transparent 72%);
      animation: aurora-shift 28s ease-in-out infinite alternate;
      filter: blur(22px);
    }
    .atm-flow-b {
      inset: -45%;
      opacity: 0.9;
      mix-blend-mode: screen;
      background:
        radial-gradient(ellipse 50% 42% at 70% 52%, rgba(61, 255, 224, 0.11), transparent 65%),
        radial-gradient(ellipse 46% 40% at 28% 72%, rgba(255, 77, 109, 0.08), transparent 68%);
      animation: aurora-shift-b 38s ease-in-out infinite alternate;
      filter: blur(34px);
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.18;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, #000 15%, transparent 75%);
    }
    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        180deg,
        transparent 0 2px,
        rgba(0, 0, 0, 0.12) 2px 3px
      );
      opacity: 0.06;
    }

    @keyframes atm-wash-drift {
      from { background-position: 0% 40%; }
      to { background-position: 80% 60%; }
    }
    @keyframes aurora-shift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to { transform: translate3d(3%, 2%, 0) scale(1.06); }
    }
    @keyframes aurora-shift-b {
      from { transform: translate3d(2%, 1%, 0) scale(1.04); }
      to { transform: translate3d(-3%, -2%, 0) scale(1); }
    }

    .top {
      position: relative;
      z-index: 2;
      flex: 0 0 42%;
      min-height: 11rem;
      max-height: 48%;
      display: grid;
      place-items: center;
      padding: 1rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .card {
      width: min(28rem, 100%);
    }

    h1 {
      margin: 0 0 1rem;
      font-family: var(--display);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .code-row {
      display: flex;
      align-items: center;
      min-height: 3.1rem;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 0.7rem;
      background: color-mix(in srgb, var(--panel-solid) 85%, transparent);
      margin-bottom: 0.85rem;
      word-break: break-all;
    }
    .code-row.empty { color: var(--mute); }
    .code-row.has-code {
      border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
      box-shadow: inset 0 0 0 1px var(--accent-dim);
    }
    .code {
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      font-weight: 700;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    button, a.btn {
      appearance: none;
      border: 0;
      border-radius: 0.65rem;
      padding: 0.85rem 0.7rem;
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease;
    }
    button:active, a.btn:active { transform: translateY(1px); }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-copy {
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 0 22px rgba(61, 255, 224, 0.16);
    }
    .btn-copy.ok { background: #9bffe9; }

    .btn-game {
      background: color-mix(in srgb, var(--panel-solid) 88%, #fff);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .status {
      margin: 0.7rem 0 0;
      font-size: 0.9rem;
      color: var(--mute);
    }
    .status[hidden] { display: none; }

    .bottom {
      position: relative;
      z-index: 1;
      flex: 1 1 58%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #0a0d12;
    }

    .frame-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }

    .frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      display: none;
    }
    .frame-wrap.is-loaded iframe { display: block; }

    .frame-gate {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      text-align: center;
      background: color-mix(in srgb, var(--bg) 88%, #122);
      z-index: 2;
    }
    .frame-wrap.is-loaded .frame-gate { display: none; }

    .frame-gate p {
      margin: 0 0 1rem;
      color: var(--mute);
      max-width: 22rem;
      line-height: 1.35;
    }

    .btn-load {
      background: var(--accent);
      color: var(--accent-ink);
      padding: 0.9rem 1.2rem;
      box-shadow: 0 0 24px rgba(61, 255, 224, 0.18);
    }

    @media (max-width: 520px) {
      .top { flex-basis: auto; max-height: none; }
      .actions { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .atm-wash, .atm-flow, .atm-flow-b { animation: none; }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="atm-wash"></div>
    <div class="atm-flow"></div>
    <div class="atm-flow atm-flow-b"></div>
    <div class="grid"></div>
    <div class="scanlines"></div>
  </div>

  <header class="top">
    <div class="card">
      <h1>Промокод</h1>
      <div id="codeRow" class="code-row empty" aria-live="polite">
        <span id="codeText" class="code">—</span>
      </div>
      <div class="actions">
        <button type="button" id="btnCopy" class="btn-copy" disabled>Скопировать</button>
        <a id="btnGame" class="btn btn-game" href="https://parapa.ru/account/promo/" target="_blank" rel="noopener noreferrer">В игру</a>
      </div>
      <p id="status" class="status" hidden></p>
    </div>
  </header>

  <section class="bottom" aria-label="Сайт активации">
    <div id="frameWrap" class="frame-wrap">
      <div class="frame-gate">
        <div>
          <p>Нижняя половина — сайт игры. Загрузка только по кнопке, чтобы не ловить 429.</p>
          <button type="button" id="btnLoad" class="btn-load">Показать сайт активации</button>
        </div>
      </div>
      <iframe id="gameFrame" title="ParaPA промо" src="about:blank"></iframe>
    </div>
  </section>

  <script>
    (function () {
      const GAME_URL = "https://parapa.ru/account/promo/";

      const params = new URLSearchParams(location.search);
      let code = (params.get("c") || params.get("code") || "").trim();
      if (!code && location.hash.length > 1) {
        code = decodeURIComponent(location.hash.slice(1)).trim();
      }
      code = code.replace(/\s+/g, "");

      const codeRow = document.getElementById("codeRow");
      const codeText = document.getElementById("codeText");
      const btnCopy = document.getElementById("btnCopy");
      const btnGame = document.getElementById("btnGame");
      const status = document.getElementById("status");
      const frameWrap = document.getElementById("frameWrap");
      const frame = document.getElementById("gameFrame");
      const btnLoad = document.getElementById("btnLoad");

      btnGame.href = GAME_URL;

      if (code) {
        codeRow.classList.remove("empty");
        codeRow.classList.add("has-code");
        codeText.textContent = code;
        btnCopy.disabled = false;
      }

      btnLoad.addEventListener("click", function () {
        frame.src = GAME_URL;
        frameWrap.classList.add("is-loaded");
      });

      async function copyCode() {
        if (!code) return;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(code);
          } else {
            const ta = document.createElement("textarea");
            ta.value = code;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          }
          btnCopy.textContent = "Скопировано";
          btnCopy.classList.add("ok");
          status.hidden = true;
          setTimeout(function () {
            btnCopy.textContent = "Скопировать";
            btnCopy.classList.remove("ok");
          }, 1600);
        } catch (err) {
          status.hidden = false;
          status.textContent = "Не удалось скопировать";
        }
      }

      btnCopy.addEventListener("click", copyCode);
    })();
  </script>
</body>
</html>
