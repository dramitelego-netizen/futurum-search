# Slim GitHub Pages deploy: drop oversized data/wiki_img (looks fall back to remote wiki URLs).
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Drop oversized look cache from site artifact
        run: |
          if [ -d data/wiki_img ]; then
            du -sh data/wiki_img || true
            rm -rf data/wiki_img
          fi
          rm -f data/watch_catalog.log data/scrape.log || true
          du -sh . || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
