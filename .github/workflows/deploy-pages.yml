# GitHub Pages: data/img + title_thumb + guide_img + look_img (+ hub/ambient videos).
# title_thumb / guide_img — список; look_img — HQ в карточке гайда.
# title_img (~400MB) в артефакт не кладём — на Pages карточки титулов берут title_thumb.
# wiki_img / старые hub-loop / pick-lab в артефакт не кладём (лимит Pages 1GB).
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required image packs
        run: |
          set -e
          test -d data/img
          test -d data/title_img
          test -d data/title_thumb
          test -d data/guide_img
          test -d data/look_img
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          def must_file(p: Path, label: str):
              if not p.is_file():
                  print(f"MISSING {label}: {p}", file=sys.stderr)
                  sys.exit(1)

          shop = json.loads(Path("data/items.json").read_text(encoding="utf-8"))
          miss_icon = []
          for it in shop.get("items") or []:
              icon = str(it.get("imageLocal") or "").lstrip("./")
              if not icon:
                  miss_icon.append(it.get("name") or it.get("id"))
                  continue
              if not Path(icon).is_file():
                  miss_icon.append(f"{it.get('name')}: {icon}")
          if miss_icon:
              print("Shop icons missing:", *miss_icon[:20], sep="\n", file=sys.stderr)
              sys.exit(1)

          wiki = json.loads(Path("data/wiki_items.json").read_text(encoding="utf-8"))
          miss_guide = []
          for it in wiki.get("items") or []:
              if it.get("kind") != "achievements":
                  continue
              img = str(it.get("image") or "").lstrip("./")
              if not img:
                  miss_guide.append(it.get("name"))
                  continue
              stem = Path(img).stem
              guide = Path("data/guide_img") / f"{stem}.webp"
              if not guide.is_file():
                  miss_guide.append(f"{it.get('name')}: {guide}")
          if miss_guide:
              print("Achievement badges missing:", *miss_guide[:20], sep="\n", file=sys.stderr)
              sys.exit(1)

          print(
              "ok images:",
              f"shop={len(shop.get('items') or [])}",
              f"guide_img={sum(1 for _ in Path('data/guide_img').iterdir())}",
              f"title_img={sum(1 for _ in Path('data/title_img').iterdir())}",
              f"title_thumb={sum(1 for _ in Path('data/title_thumb').iterdir())}",
          )
          PY

      - name: Drop unused / oversized files from Pages artifact
        run: |
          set -e
          # Скрейп/логи
          rm -f data/watch_catalog.log data/scrape.log || true
          rm -f data/_wiki_page_*.html data/_wiki_*.html data/_gift_*.html 2>/dev/null || true

          # Старые hub-ролики: сайт использует только *-cycle.mp4
          rm -f hub-*-idle-loop.mp4 hub-*-float-loop.mp4 hub-*-open-in.mp4 hub-*-close-out.mp4 || true
          # Старый ambient (живой — home-bg-ambient-b.mp4)
          rm -f home-bg-ambient.mp4 || true
          # Черновики / лабы / зеркала
          rm -f *-pick.html *-lab.html hub-opts.html 2>/dev/null || true
          rm -rf hub-opts public tools bg-drafts vk-brand gacha-api assets 2>/dev/null || true
          rm -f _*.py _*.js _*.md 2>/dev/null || true
          # не трогаем .github — иначе иногда ломается поиск pages-артефакта

          # title_img ~400MB: на Pages берём title_thumb (см. mapTitleImgPack)
          rm -rf data/title_img
          # wiki_img в git обычно нет; на всякий случай не тащим
          rm -rf data/wiki_img 2>/dev/null || true

          echo "Artifact footprint:"
          du -sh data/img data/title_thumb data/guide_img data/look_img 2>/dev/null || true
          du -sh hub-*-cycle.mp4 home-bg-ambient-b.mp4 2>/dev/null || true
          du -sh . || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
