<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="robots" content="noindex, nofollow" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scan-линия — эффекты при вводе</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07090d;
      --panel: #12161e;
      --ink: #e8eef7;
      --mute: #7d8a9a;
      --accent: #3dffe0;
      --line: rgba(232, 238, 247, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Rajdhani", sans-serif;
      background:
        radial-gradient(ellipse 70% 45% at 20% 0%, #0f1a1c, transparent 55%),
        var(--bg);
      color: var(--ink);
      padding: 1.35rem clamp(1rem, 3vw, 2rem) 3rem;
    }
    h1 {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0 0 0.35rem;
    }
    .lead {
      color: var(--mute);
      margin: 0 0 1.2rem;
      max-width: 44rem;
      line-height: 1.45;
    }
    .lead strong { color: var(--accent); }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    .card {
      background: color-mix(in srgb, var(--panel) 94%, black);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card.is-picked {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .card-num {
      font-family: "Orbitron", sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      color: var(--accent);
    }
    .card-title { font-weight: 700; font-size: 1.05rem; }
    .card-desc { margin: 0; color: var(--mute); font-size: 0.86rem; line-height: 1.35; }
    .demo {
      padding: 1.15rem 0.9rem 1.35rem;
      border-radius: 12px;
      background: #0a0c10;
      border: 1px solid var(--line);
    }
    .wrap {
      position: relative;
      max-width: 100%;
    }
    .wrap input {
      width: 100%;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      text-align: center;
      padding: 0.85rem 1rem;
      outline: none;
      -webkit-appearance: none;
    }
    .wrap input::placeholder { color: var(--mute); text-align: center; }
    .scan {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 0;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
      pointer-events: none;
      transition: opacity 0.2s, left 0.25s, right 0.25s;
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .wrap:focus-within .scan,
    .wrap.is-typing .scan {
      opacity: 1;
      left: 4%;
      right: 4%;
    }
    .pick {
      margin-top: auto;
      align-self: flex-start;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      color: var(--accent);
      font: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .pick:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
    .card.is-picked .pick {
      background: var(--accent);
      color: #041014;
      border-color: var(--accent);
    }
    .footer-pick {
      position: sticky;
      bottom: 0.75rem;
      margin-top: 1.5rem;
      padding: 0.9rem 1rem;
      border-radius: 14px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      background: color-mix(in srgb, var(--panel) 92%, black);
      backdrop-filter: blur(10px);
      color: var(--mute);
      font-size: 0.95rem;
      z-index: 5;
    }
    .footer-pick strong { color: var(--accent); }

    /* —— эффекты только пока is-typing —— */
    .v1.is-typing .scan {
      animation: soft-pulse 1.1s ease-in-out infinite;
    }
    @keyframes soft-pulse {
      0%, 100% { opacity: 0.55; box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent); }
      50% { opacity: 1; box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent); }
    }

    .v2.is-typing .scan {
      animation: breathe 1.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scaleX(0.92); opacity: 0.5; }
      50% { transform: scaleX(1); opacity: 1; }
    }

    .v3.is-typing .scan {
      animation: blink 0.7s steps(2, end) infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .v4.is-typing .scan {
      height: 2px;
      animation: thick-pulse 0.9s ease-in-out infinite;
    }
    @keyframes thick-pulse {
      0%, 100% { height: 2px; opacity: 0.6; }
      50% { height: 3.5px; opacity: 1; }
    }

    .v5.is-typing .scan {
      animation: sweep 1.2s linear infinite;
      background: linear-gradient(90deg, transparent 0%, var(--accent) 45%, #fff 50%, var(--accent) 55%, transparent 100%);
      background-size: 220% 100%;
    }
    @keyframes sweep {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .v6.is-typing .scan {
      animation: radar 1.6s ease-in-out infinite;
    }
    @keyframes radar {
      0%, 100% { left: 18%; right: 18%; opacity: 0.45; }
      50% { left: 2%; right: 2%; opacity: 1; }
    }

    .v7.is-typing .scan {
      animation: heartbeat 0.85s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 100% { opacity: 0.45; transform: scaleX(1); }
      15% { opacity: 1; transform: scaleX(1.02); }
      30% { opacity: 0.5; transform: scaleX(0.98); }
      45% { opacity: 1; transform: scaleX(1.03); }
      60% { opacity: 0.55; }
    }

    .v8.is-typing .scan {
      animation: glow-wave 1.3s ease-in-out infinite;
      box-shadow:
        0 0 8px color-mix(in srgb, var(--accent) 40%, transparent),
        0 0 22px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    @keyframes glow-wave {
      0%, 100% { filter: brightness(0.85); }
      50% { filter: brightness(1.45); }
    }

    .v9.is-typing .scan {
      animation: dash-run 0.9s linear infinite;
      height: 2px;
      background: repeating-linear-gradient(
        90deg,
        var(--accent) 0 10px,
        transparent 10px 18px
      );
      background-size: 28px 100%;
    }
    @keyframes dash-run {
      to { background-position: 28px 0; }
    }

    .v10.is-typing .scan {
      animation: dual-flash 1s ease-in-out infinite;
    }
    @keyframes dual-flash {
      0%, 100% { opacity: 0.4; box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 20%, transparent); }
      25% { opacity: 1; box-shadow: 0 0 16px var(--accent); }
      50% { opacity: 0.35; }
      75% { opacity: 0.95; box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 60%, transparent); }
    }

    .v11.is-typing .scan {
      animation: rise-fade 1.1s ease-out infinite;
    }
    @keyframes rise-fade {
      0% { opacity: 0.3; transform: translateY(0); filter: blur(0); }
      40% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-6px); filter: blur(1px); }
    }

    .v12.is-typing .scan {
      animation: color-shift 1.8s linear infinite;
    }
    @keyframes color-shift {
      0% { filter: hue-rotate(0deg); opacity: 0.85; }
      50% { filter: hue-rotate(40deg); opacity: 1; }
      100% { filter: hue-rotate(0deg); opacity: 0.85; }
    }

    .v13.is-typing .scan {
      animation: type-kick 0.18s ease-out;
    }
    @keyframes type-kick {
      0% { opacity: 0.45; transform: scaleX(0.96); }
      40% { opacity: 1; transform: scaleX(1.04); box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 55%, transparent); }
      100% { opacity: 0.7; transform: scaleX(1); }
    }

    .v14.is-typing .scan {
      animation: soft-pulse 1.1s ease-in-out infinite, sweep 2.4s linear infinite;
      background: linear-gradient(90deg, transparent 0%, var(--accent) 45%, #b8fff5 50%, var(--accent) 55%, transparent 100%);
      background-size: 200% 100%;
    }

    .v15.is-typing .scan {
      animation: neon-edge 1.2s ease-in-out infinite;
    }
    @keyframes neon-edge {
      0%, 100% {
        opacity: 0.5;
        box-shadow:
          -40px 0 14px -6px color-mix(in srgb, var(--accent) 50%, transparent),
          40px 0 14px -6px color-mix(in srgb, var(--accent) 50%, transparent);
      }
      50% {
        opacity: 1;
        box-shadow:
          -20px 0 18px -2px var(--accent),
          20px 0 18px -2px var(--accent);
      }
    }

    .v16.is-typing .scan {
      height: 2px;
      animation: equalizer 0.55s ease-in-out infinite alternate;
      clip-path: inset(0 8% 0 8%);
    }
    @keyframes equalizer {
      0% { clip-path: inset(0 22% 0 22%); opacity: 0.55; }
      100% { clip-path: inset(0 2% 0 2%); opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Полоска при вводе</h1>
  <p class="lead">
    Начни печатать в поле — эффект включается только во время ввода
    (через ~0.8 с после последней буквы гаснет до спокойной линии).
    Выбери вариант и напиши номер.
  </p>

  <div class="grid" id="grid"></div>
  <div class="footer-pick" id="chosen">Выбрано: <strong>пока ничего</strong></div>

  <script>
    const VARIANTS = [
      { id: 1, title: "Soft pulse", desc: "Мягко пульсирует яркость и свечение — то, что ты описал." },
      { id: 2, title: "Breathe", desc: "Дышит: чуть сжимается и расширяется по ширине." },
      { id: 3, title: "Blink", desc: "Ритмичное мигание, как курсор." },
      { id: 4, title: "Thick pulse", desc: "Полоска чуть толстеет и тончает." },
      { id: 5, title: "Sweep", desc: "Блик бежит по линии слева направо." },
      { id: 6, title: "Radar", desc: "Линия то короче, то на всю ширину." },
      { id: 7, title: "Heartbeat", desc: "Двойной «тук-тук» пульс." },
      { id: 8, title: "Glow wave", desc: "Сильное свечение волнами, без мигания." },
      { id: 9, title: "Dash run", desc: "Пунктир бежит по линии." },
      { id: 10, title: "Dual flash", desc: "Две вспышки за цикл — живее." },
      { id: 11, title: "Rise fade", desc: "Вспышка поднимается вверх и растворяется." },
      { id: 12, title: "Hue shift", desc: "Лёгкий сдвиг оттенка бирюзы." },
      { id: 13, title: "Type kick", desc: "Короткий пинок при каждой букве (не цикл)." },
      { id: 14, title: "Pulse + sweep", desc: "Комбо: пульс и бегущий блик." },
      { id: 15, title: "Neon edges", desc: "Свечение «с концов» к центру." },
      { id: 16, title: "Equalizer", desc: "Как эквалайзер: ширина скачет." },
    ];

    const grid = document.getElementById("grid");
    const chosen = document.getElementById("chosen");

    VARIANTS.forEach((v) => {
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.variant = String(v.id);
      card.innerHTML = `
        <span class="card-num">ВАРИАНТ ${v.id}</span>
        <div class="card-title">${v.title}</div>
        <p class="card-desc">${v.desc}</p>
        <div class="demo">
          <div class="wrap v${v.id}">
            <input type="search" placeholder="Начни печатать…" autocomplete="off" spellcheck="false" />
            <span class="scan" aria-hidden="true"></span>
          </div>
        </div>
        <button type="button" class="pick">Выбрать</button>
      `;

      const wrap = card.querySelector(".wrap");
      const input = card.querySelector("input");
      const scan = card.querySelector(".scan");
      let idleTimer = null;

      function markTyping() {
        wrap.classList.add("is-typing");
        if (v.id === 13) {
          scan.style.animation = "none";
          void scan.offsetWidth;
          scan.style.animation = "";
          scan.classList.remove("kick");
          void scan.offsetWidth;
          // reuse type-kick via forcing animation
          scan.style.animation = "type-kick 0.18s ease-out";
        }
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          wrap.classList.remove("is-typing");
          if (v.id === 13) scan.style.animation = "";
        }, 800);
      }

      input.addEventListener("input", markTyping);
      input.addEventListener("focus", () => {
        if (input.value) markTyping();
      });

      card.querySelector(".pick").addEventListener("click", () => {
        document.querySelectorAll(".card").forEach((c) => c.classList.remove("is-picked"));
        card.classList.add("is-picked");
        chosen.innerHTML = `Выбрано: <strong>вариант ${v.id} — ${v.title}</strong>. Напиши в чат: <strong>${v.id}</strong>`;
      });

      grid.appendChild(card);
    });
  </script>
</body>
</html>
