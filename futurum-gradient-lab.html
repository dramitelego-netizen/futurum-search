<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>FUTURUM · 20 градиент-анимаций</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07090d;
      --ink: #e8eef7;
      --mute: #7d8a9a;
      --line: rgba(232, 238, 247, 0.1);
      --panel: #10141c;
      --accent: #3dffe0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Rajdhani, system-ui, sans-serif;
      background:
        radial-gradient(ellipse 70% 40% at 15% 0%, #0f1a1c, transparent 55%),
        radial-gradient(ellipse 50% 35% at 90% 8%, rgba(61, 255, 224, 0.05), transparent 50%),
        var(--bg);
    }

    header {
      padding: 1.4rem clamp(1rem, 3vw, 2rem) 0.6rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    header h1 {
      margin: 0 0 0.35rem;
      font-family: Orbitron, sans-serif;
      font-size: clamp(0.95rem, 2.4vw, 1.2rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    header p {
      margin: 0;
      color: var(--mute);
      font-size: 1rem;
      max-width: 36rem;
    }
    header a { color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      padding: 1rem clamp(1rem, 3vw, 2rem) 3rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.15rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 168px;
    }
    .card .meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      color: var(--mute);
      font-size: 0.88rem;
    }
    .card .num {
      font-family: Orbitron, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: color-mix(in srgb, var(--accent) 70%, var(--mute));
    }
    .card .title { font-weight: 600; }

    .stage {
      flex: 1;
      display: grid;
      place-items: center;
      min-height: 88px;
      border-radius: 12px;
      background: #0a0d12;
      border: 1px solid rgba(232, 238, 247, 0.06);
      overflow: hidden;
    }

    .word {
      display: inline-block;
      font-family: Orbitron, sans-serif;
      font-weight: 800;
      font-size: clamp(1.7rem, 4.5vw, 2.2rem);
      letter-spacing: 0.12em;
      line-height: 1.15;
      user-select: none;
      /* fallback, если clip не сработает */
      color: var(--accent);
    }

    /*
      Плавный цикл: градиент удвоен (A→B→A → A→B→A),
      background-size: 200%, сдвиг ровно на 50% = без рывка.
      Не использовать shorthand `background` — сбрасывает clip.
    */
    @keyframes flowX {
      from { background-position: 0% 50%; }
      to { background-position: 100% 50%; }
    }
    @keyframes flowY {
      from { background-position: 50% 0%; }
      to { background-position: 50% 100%; }
    }
    @keyframes swayX {
      from { background-position: 0% 50%; }
      to { background-position: 100% 50%; }
    }
    @keyframes swayY {
      from { background-position: 50% 0%; }
      to { background-position: 50% 100%; }
    }
    @keyframes softGlow {
      from { filter: drop-shadow(0 0 6px rgba(61, 255, 224, 0.25)); }
      to { filter: drop-shadow(0 0 16px rgba(61, 255, 224, 0.55)); }
    }

    @property --a {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }
    @keyframes ang {
      to { --a: 360deg; }
    }
    @keyframes hue {
      to { filter: hue-rotate(360deg); }
    }

    .g01 {
      background-image: linear-gradient(
        90deg,
        #1a3a36, #3dffe0, #e8fff9, #7cf0ff, #3dffe0, #1a3a36,
        #3dffe0, #e8fff9, #7cf0ff, #3dffe0, #1a3a36
      );
      background-size: 200% 100%;
      animation: flowX 6s linear infinite;
    }

    .g02 {
      background-image: linear-gradient(
        180deg,
        #9ff7e8, #3dffe0, #1ec8b0, #3dffe0, #9ff7e8,
        #3dffe0, #1ec8b0, #3dffe0, #9ff7e8
      );
      background-size: 100% 200%;
      animation: swayY 5.5s ease-in-out infinite alternate;
    }

    .g03 {
      background-image: linear-gradient(
        90deg,
        #6a7380, #e8eef7, #8a93a0, #f5f7fa, #5c6572, #d7dde8, #6a7380,
        #e8eef7, #8a93a0, #f5f7fa, #5c6572, #d7dde8, #6a7380
      );
      background-size: 200% 100%;
      animation: flowX 5s linear infinite;
    }

    .g04 {
      background-image: linear-gradient(
        90deg,
        #3a1208, #ff6a3d, #ffd28a, #ff4d6d, #3a1208,
        #ff6a3d, #ffd28a, #ff4d6d, #3a1208
      );
      background-size: 200% 100%;
      animation: flowX 7s linear infinite;
    }

    .g05 {
      background-image: linear-gradient(
        90deg,
        #0b1c2e, #7ec8ff, #eaf6ff, #4aa3e8, #0b1c2e,
        #7ec8ff, #eaf6ff, #4aa3e8, #0b1c2e
      );
      background-size: 200% 100%;
      animation: flowX 6.5s linear infinite;
    }

    .g06 {
      background-image: conic-gradient(
        from var(--a),
        #3dffe0, #145850, #9bfff0, #0c2422, #3dffe0
      );
      animation: ang 8s linear infinite;
    }

    .g07 {
      background-image: linear-gradient(90deg, #3dffe0, #ff4d6d, #3dffe0, #ff4d6d, #3dffe0);
      background-size: 200% 100%;
      animation: swayX 4.5s ease-in-out infinite alternate;
    }

    .g08 {
      background-image: linear-gradient(
        90deg,
        #1a2422, #1a2422, #3dffe0, #ffffff, #3dffe0, #1a2422, #1a2422,
        #1a2422, #3dffe0, #ffffff, #3dffe0, #1a2422, #1a2422
      );
      background-size: 200% 100%;
      animation: flowX 4.5s linear infinite;
    }

    .g09 {
      background-image: linear-gradient(
        90deg,
        #142418, #6fbf73, #d8f5c8, #3d8f5a, #142418,
        #6fbf73, #d8f5c8, #3d8f5a, #142418
      );
      background-size: 200% 100%;
      animation: flowX 8s linear infinite;
    }

    .g10 {
      background-image: linear-gradient(
        90deg,
        #3a2a0a, #c9a227, #fff3c4, #a67c00, #ffe08a, #8a6a12, #3a2a0a,
        #c9a227, #fff3c4, #a67c00, #ffe08a, #8a6a12, #3a2a0a
      );
      background-size: 200% 100%;
      animation: flowX 6s linear infinite;
    }

    .g11 {
      background-image: repeating-linear-gradient(
        -28deg,
        #0d1514 0 12px,
        #3dffe0 12px 16px,
        #9bfff0 16px 20px,
        #1a3a36 20px 32px
      );
      background-size: 64px 64px;
      animation: tileDiag 2.8s linear infinite;
    }
    @keyframes tileDiag {
      from { background-position: 0 0; }
      to { background-position: 64px 64px; }
    }

    .g12 {
      background-image: linear-gradient(
        90deg,
        #3dffe0, #5ad0ff, #7a9bff, #3dffe0,
        #5ad0ff, #7a9bff, #3dffe0
      );
      background-size: 200% 100%;
      animation: flowX 7s linear infinite, hue 12s linear infinite;
    }

    .g13 {
      background-image: linear-gradient(
        90deg,
        #2a9f90, #3dffe0, #ffffff, #3dffe0, #2a9f90,
        #3dffe0, #ffffff, #3dffe0, #2a9f90
      );
      background-size: 200% 100%;
      animation: flowX 5.5s linear infinite, softGlow 2.8s ease-in-out infinite alternate;
    }

    .g14 {
      background-image: linear-gradient(
        90deg,
        #1a1030, #ff7a59, #ffb347, #ff5e7a, #1a1030,
        #ff7a59, #ffb347, #ff5e7a, #1a1030
      );
      background-size: 200% 100%;
      animation: flowX 7.5s linear infinite;
    }

    .g15 {
      background-image: linear-gradient(
        180deg,
        #041208, #1dff7a, #a8ffce, #0a3d22, #041208,
        #1dff7a, #a8ffce, #0a3d22, #041208
      );
      background-size: 100% 200%;
      animation: flowY 6s linear infinite;
    }

    .g16 {
      background-image: linear-gradient(
        90deg,
        #c5ccd6, #3dffe0, #e8eef7, #1ec8b0, #c5ccd6,
        #3dffe0, #e8eef7, #1ec8b0, #c5ccd6
      );
      background-size: 200% 100%;
      animation: swayX 5s ease-in-out infinite alternate;
    }

    .g17 {
      background-image: radial-gradient(
        circle at 40% 50%,
        #fff 0%, #3dffe0 22%, #0d2a28 48%, #3dffe0 72%, #0a1211 100%
      );
      background-size: 180% 180%;
      animation: swayX 5.5s ease-in-out infinite alternate;
    }

    .g18 {
      background-image: linear-gradient(
        90deg,
        #0c1016, #3dffe0, #ffffff, #3dffe0, #0c1016,
        #3dffe0, #ffffff, #3dffe0, #0c1016
      );
      background-size: 200% 100%;
      animation: flowX 3.8s linear infinite, softGlow 2.2s ease-in-out infinite alternate;
    }

    .g19 {
      background-image: linear-gradient(
        90deg,
        #2a1810, #c47a4a, #f0c9a0, #8a4a2a, #2a1810,
        #c47a4a, #f0c9a0, #8a4a2a, #2a1810
      );
      background-size: 200% 100%;
      animation: flowX 7s linear infinite;
    }

    .g20 {
      background-image: conic-gradient(
        from var(--a),
        #0a1211, #3dffe0, #ffffff, #7cf0ff, #1a4a44, #3dffe0, #0a1211
      );
      animation: ang 7s linear infinite, softGlow 3s ease-in-out infinite alternate;
    }

    /* clip ПОСЛЕ всех градиентов — иначе снова полоса вместо слова */
    .word.clip {
      color: transparent;
      -webkit-text-fill-color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
    }

    @media (prefers-reduced-motion: reduce) {
      .word.clip {
        animation: none !important;
        filter: none !important;
        color: var(--accent);
        -webkit-text-fill-color: var(--accent);
        background-image: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>FUTURUM · gradient lab</h1>
    <p>20 вариантов с плавным бесшовным циклом (без резкого обрыва). Выбери номер — перенесём на главную. <a href="./">← сайт</a></p>
  </header>

  <div class="grid" id="grid"></div>

  <script>
    const samples = [
      { id: 1, title: "Mint aurora", cls: "g01", note: "бренд-мята, плавный проход" },
      { id: 2, title: "Vertical breath", cls: "g02", note: "мягкое дыхание вверх-вниз" },
      { id: 3, title: "Chrome liquid", cls: "g03", note: "жидкий металл" },
      { id: 4, title: "Ember drift", cls: "g04", note: "уголь → жар" },
      { id: 5, title: "Ice shard", cls: "g05", note: "холодный лёд" },
      { id: 6, title: "Conic spin", cls: "g06", note: "крутящийся конус" },
      { id: 7, title: "Mint × Rose", cls: "g07", note: "мята и акцент скидки" },
      { id: 8, title: "Neon scan", cls: "g08", note: "сканирующая полоса" },
      { id: 9, title: "Forest moss", cls: "g09", note: "зелёный мох" },
      { id: 10, title: "Gold foil", cls: "g10", note: "золотая фольга" },
      { id: 11, title: "Diagonal slash", cls: "g11", note: "диагональные полосы" },
      { id: 12, title: "Hue wash", cls: "g12", note: "сдвиг оттенка" },
      { id: 13, title: "Glow shimmer", cls: "g13", note: "свечение + блик" },
      { id: 14, title: "Sunset strip", cls: "g14", note: "закат" },
      { id: 15, title: "Matrix tint", cls: "g15", note: "зелёный вертикальный" },
      { id: 16, title: "Silver ↔ teal", cls: "g16", note: "серебро в мяту" },
      { id: 17, title: "Radial breathe", cls: "g17", note: "радиальное дыхание" },
      { id: 18, title: "Electric flicker", cls: "g18", note: "электро-мерцание" },
      { id: 19, title: "Copper rust", cls: "g19", note: "медь" },
      { id: 20, title: "Orbit ring", cls: "g20", note: "орбита + glow" },
    ];

    const grid = document.getElementById("grid");
    for (const s of samples) {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="meta">
          <span class="num">#${String(s.id).padStart(2, "0")}</span>
          <span class="title">${s.title}</span>
        </div>
        <div class="stage">
          <span class="word clip ${s.cls}">FUTURUM</span>
        </div>
        <div class="meta"><span>${s.note}</span></div>
      `;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
